<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartão de Visitas - Gustavo Franco</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bolinhas do fundo -->
    <div class="bolinha bolinha1"></div>
    <div class="bolinha bolinha2"></div>
    <div class="bolinha bolinha3"></div>
    <div class="bolinha bolinha4"></div>
    <div class="bolinha bolinha5"></div>
    <div class="bolinha bolinha6"></div>

    <!-- Cartão -->
    <main class="cartao">

        <div class="topo">

            <div class="avatar">
                <img src="foto.jpg" alt="Foto de Gustavo Franco">
            </div>

            <span class="status">
                ● DISPONÍVEL
            </span>

        </div>

        <div class="perfil">

            <p class="etiqueta">
                ESTUDANTE DE TECNOLOGIA
            </p>

            <h1>
                Gustavo Franco
            </h1>

            <p class="cargo">
                Tecnologia da Informação
            </p>

            <p class="descricao">
                Estudante de TI interessado em desenvolvimento
                web, programação e tecnologia.
            </p>

        </div>

        <div class="linha"></div>

        <div class="contato">

            <a class="botao-contato" href="mailto:Gustavofranco@gmail.com">

                <span class="icone">
                    ✉
                </span>

                <span class="texto">
                    <small>E-MAIL</small>
                    Meu e-mail
                </span>

                <strong>↗</strong>

            </a>

            <a class="botao-contato"
               href="https://github.com/GustavoFrancozz"
               target="_blank">

                <span class="icone">
                    ◉
                </span>

                <span class="texto">
                    <small>GITHUB</small>
                    Meu GitHub
                </span>

                <strong>↗</strong>

            </a>

        </div>

        <button id="botaoTema">
            🌙 Modo escuro
        </button>

        <footer>
            © 2026 Gustavo Franco
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
